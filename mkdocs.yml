site_name: TranceSQL
site_url: https://github.com/navakanth1984/TranceSQL
site_description: A self-correcting natural language to SQL translator using Gemini 2.5 Pro

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Connectors Guide: connectors.md
  - Telemetry & Feedback: telemetry.md
  - Developer & Release Guide: development.md
  - ACDLC Blueprint: ../ACDLC.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - def_list
  - toc:
      permalink: true
